appId: com.agenttaskcenter.app
productName: Foreman
copyright: Copyright © 2026 xwei
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/icon.png
  - package.json
# node-pty loads native binaries (pty.node, conpty.dll, OpenConsole.exe) from disk.
asarUnpack:
  - node_modules/node-pty/**
# node-pty ships N-API prebuilds that work in Electron as-is.
npmRebuild: false
# Copy the Electron already installed in node_modules instead of extracting the
# zip to a temp folder and renaming it (antivirus scanning makes that rename fail).
electronDist: node_modules/electron/dist
extraResources:
  - from: resources/skills
    to: skills
    filter:
      - '**/*'
      - '!**/tests/**'
# Installed copies update themselves from this repo's GitHub releases (electron-updater).
# Each release needs the installer, its .blockmap and latest.yml from dist/.
publish:
  provider: github
  owner: xw2781
  repo: Foreman
  releaseType: release
win:
  target:
    - nsis
  icon: resources/icon.png
  artifactName: Foreman-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Foreman
